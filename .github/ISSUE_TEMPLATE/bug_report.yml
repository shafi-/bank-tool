name: Bug report
description: Report a problem with Bank.Query
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Bank.Query runs entirely in your browser — please
        don't paste statement contents or personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it? (e.g. which PDF layout, what query)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
