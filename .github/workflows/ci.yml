name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check app.js syntax (ESM)
        run: node --check --input-type=module < standalone/app.js

      - name: Check sw.js syntax
        run: node --check standalone/sw.js

      - name: Verify app entrypoint exists
        run: test -f standalone/index.html && echo "index.html present"
