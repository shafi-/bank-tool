<!DOCTYPE html>
<html>
<head>
  <title>Generate PWA Icons</title>
  <style>
    body { font-family: system-ui; padding: 20px; background: #f5f2ed; }
    h1 { color: #1a1714; }
    .icon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
    .icon-item { text-align: center; }
    canvas { border: 2px solid #e0d8ce; border-radius: 8px; cursor: pointer; }
    canvas:hover { border-color: #c8402a; }
    .filename { margin-top: 8px; font-family: monospace; font-size: 12px; color: #4a4540; }
    .hint { margin: 20px 0; padding: 15px; background: #faf8f5; border-radius: 8px; border: 1px solid #e0d8ce; }
  </style>
</head>
<body>
  <h1>🏦 Bank.Query Icon Generator</h1>
  <div class="hint">
    <strong>Instructions:</strong> Click any icon below to download it. Save all icons for the PWA.
  </div>
  <div class="icon-grid" id="grid"></div>

  <script>
    function drawIcon(canvas, size, maskable = false) {
      const ctx = canvas.getContext('2d');

      if (maskable) {
        // Full background for maskable
        ctx.fillStyle = '#1a1714';
        ctx.fillRect(0, 0, size, size);
      }

      // Red card background
      const padding = maskable ? size * 0.15 : size * 0.08;
      const cardSize = size - (padding * 2);
      const radius = size * 0.04;

      ctx.fillStyle = '#c8402a';
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(padding, padding, cardSize, cardSize, radius);
      } else {
        ctx.rect(padding, padding, cardSize, cardSize);
      }
      ctx.fill();

      // "B" text
      const fontSize = Math.floor(size * 0.35);
      ctx.fillStyle = '#faf8f5';
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('B', size / 2, size * 0.42);

      // "$" text
      const symbolSize = Math.floor(size * 0.22);
      ctx.font = `${symbolSize}px monospace`;
      ctx.fillText('$', size / 2, size * 0.68);
    }

    const sizes = [
      { size: 72, name: 'icon-72.png' },
      { size: 96, name: 'icon-96.png' },
      { size: 128, name: 'icon-128.png' },
      { size: 144, name: 'icon-144.png' },
      { size: 152, name: 'icon-152.png' },
      { size: 192, name: 'icon-192.png' },
      { size: 384, name: 'icon-384.png' },
      { size: 512, name: 'icon-512.png' },
      { size: 512, name: 'icon-maskable-512.png', maskable: true },
    ];

    const grid = document.getElementById('grid');

    sizes.forEach(({ size, name, maskable }) => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.title = `Click to download ${name}`;

      drawIcon(canvas, size, maskable);

      canvas.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = name;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });

      const item = document.createElement('div');
      item.className = 'icon-item';
      item.innerHTML = `<canvas width="${size}" height="${size}" style="width:128px;height:128px"></canvas><div class="filename">${name}</div>`;
      item.querySelector('canvas').replaceWith(canvas);
      grid.appendChild(item);
    });
  </script>
</body>
</html>
